<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Chepu Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #333; color: white; border: none; cursor: pointer; margin-top: 15px;}
        .result-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; border: 1px solid #ccd; }
        .result-box p { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Product Details Extractor</h2>
        <input type="text" id="product-link" placeholder="Meesho ya kisi product ka link paste karo...">
        <button onclick="fetchProductDetails()">Get Details</button>
        <div id="scraper-result"></div>
        
        <br><br>
        <a href="index.html" style="text-decoration: none; color: blue;">⬅ Back to Store</a>
    </div>

    <script>
        async function fetchProductDetails() {
            const linkInput = document.getElementById('product-link').value;
            const resultDiv = document.getElementById('scraper-result');

            if (!linkInput) {
                resultDiv.innerHTML = "<p style='color: red;'>Pehle product ka link daalo!</p>";
                return;
            }

            resultDiv.innerHTML = "<p>Data nikal raha hoon... thoda wait karo...</p>";

            try {
                const response = await fetch('https://shree-commerce-backend.onrender.com/get-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: linkInput })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="result-box">
                            <h4>Scraped Details:</h4>
                            <p><strong>Name:</strong> ${data.product.name}</p>
                            <p><strong>Price:</strong> ${data.product.price}</p>
                            <p><strong>Fabric:</strong> ${data.product.fabric}</p>
                            <p><strong>Size:</strong> ${data.product.size}</p>
                            <p><strong>Color:</strong> ${data.product.color}</p>
                            <p style="color: green; font-size: 14px; margin-top: 10px;">${data.product.message}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Backend connect nahi hua. Shayad server sleep mode me hai.</p>`;
            }
        }
    </script>
</body>
</html>
