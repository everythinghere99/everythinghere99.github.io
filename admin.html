<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Chepu Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        textarea, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 180px; resize: vertical; }
        button { background: #333; color: white; border: none; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; padding: 12px;}
        button:hover { background: #555; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; border: 1px solid #ccd; display: none; }
        .result-box input { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .result-box label { font-size: 12px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart Extractor 🎯</h2>
        <p style="font-size: 14px; color: #555;">Meesho ka poora product text copy karke yahan paste karo.</p>
        
        <textarea id="product-text" placeholder="Paste here..."></textarea>
        
        <button onclick="extractSmartDetails()">Extract Details</button>
        
        <div id="scraper-result" class="result-box">
            <h4>Extracted Details (Editable):</h4>
            <label>Name:</label>
            <input type="text" id="res-name">
            
            <label>Price:</label>
            <input type="text" id="res-price">
            
            <label>Fabric:</label>
            <input type="text" id="res-fabric">
            
            <label>Color:</label>
            <input type="text" id="res-color">
            
            <label>Size:</label>
            <input type="text" id="res-size">
        </div>
        
        <br><br>
        <a href="index.html" style="text-decoration: none; color: blue;">⬅ Back to Store</a>
    </div>

            <script>
        function extractSmartDetails() {
            const text = document.getElementById('product-text').value;
            const resultDiv = document.getElementById('scraper-result');

            if (!text.trim()) {
                alert("Bhai pehle text paste kar!");
                return;
            }

            let name = "Nahi mila";
            let price = "Nahi mila";
            let fabric = "Nahi mila";
            let color = "Nahi mila";
            let size = "Nahi mila";

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let lower = line.toLowerCase();

                // 1. Exact "Name:"
                if (lower.startsWith('name:') && name === "Nahi mila") {
                    name = line.replace(/^name\s*:/i, '').trim();
                }

                // 2. Price
                if (lower.includes('₹') && price === "Nahi mila") {
                    let match = line.match(/₹\s*([0-9,]+)/);
                    if (match) price = "₹" + match[1];
                }

                // 3. Color
                if ((lower.includes('color') || lower.includes('colour')) && color === "Nahi mila") {
                    if (line.includes(':')) {
                        color = line.split(':')[1].trim();
                    } else if (i + 1 < lines.length) {
                        color = lines[i+1].trim();
                    }
                }

                // 4. Fabric / Material
                if ((lower.includes('fabric') || lower.includes('material')) && fabric === "Nahi mila") {
                    if (line.includes(':')) {
                        fabric = line.split(':')[1].trim();
                    } else if (i + 1 < lines.length) {
                        fabric = lines[i+1].trim();
                    }
                }

                // 5. Size (Smart Filter Applied)
                if ((lower.includes('size') || lower.includes('sizes')) && size === "Nahi mila") {
                    let val = line.includes(':') ? line.substring(line.indexOf(':') + 1).trim() : "";
                    if (!val && i + 1 < lines.length) {
                        val = lines[i+1].trim();
                    }
                    
                    if (val) {
                        // Asli size dhoondhne wala formula (IND, UK, US, S, M, L, XL, Free Size)
                        let sizeRegex = /\b(?:IND|UK|US|EU)\s*[-]?\s*\d+\b|\b(?:XS|S|M|L|XL|XXL|XXXL)\b|\bFree\s*Size\b/gi;
                        let matchedSizes = val.match(sizeRegex);
                        
                        if (matchedSizes) {
                            // Faltu words hatae aur duplicate sizes ko ek kiya
                            size = [...new Set(matchedSizes.map(s => s.toUpperCase()))].join(', ');
                        } else {
                            // Agar kapdo ka custom size 28, 30 numbers me ho
                            let numMatch = val.match(/\b\d{1,2}\b/g);
                            if (numMatch && numMatch.length > 0 && numMatch.length < 8) {
                                size = numMatch.join(', ');
                            } else {
                                size = val.substring(0, 15).trim(); // Safety ke liye lamba text cut
                            }
                        }
                    }
                }
            }

            // Fallback for Name
            if (name === "Nahi mila") {
                for (let i = 0; i < Math.min(10, lines.length); i++) {
                    let line = lines[i];
                    if (!line.match(/[\u0900-\u097F]/) && !line.includes('₹') && line.length > 6) {
                        name = line;
                        break;
                    }
                }
            }

            document.getElementById('res-name').value = name;
            document.getElementById('res-price').value = price;
            document.getElementById('res-fabric').value = fabric;
            document.getElementById('res-color').value = color;
            document.getElementById('res-size').value = size;

            resultDiv.style.display = "block";
        }
    </script>


</body>
</html>
