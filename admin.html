<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Chepu Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        textarea, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 180px; resize: vertical; }
        button { background: #333; color: white; border: none; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; padding: 12px;}
        button:hover { background: #555; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; border: 1px solid #ccd; display: none; }
        .result-box input { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .result-box label { font-size: 12px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart Extractor 🎯</h2>
        <p style="font-size: 14px; color: #555;">Meesho ka poora product text copy karke yahan paste karo.</p>
        
        <textarea id="product-text" placeholder="Paste here..."></textarea>
        
        <button onclick="extractSmartDetails()">Extract Details</button>
        
        <div id="scraper-result" class="result-box">
            <h4>Extracted Details (Editable):</h4>
            <label>Name:</label>
            <input type="text" id="res-name">
            
            <label>Price:</label>
            <input type="text" id="res-price">
            
            <label>Fabric:</label>
            <input type="text" id="res-fabric">
            
            <label>Color:</label>
            <input type="text" id="res-color">
            
            <label>Size:</label>
            <input type="text" id="res-size">
        </div>
        
        <br><br>
        <a href="index.html" style="text-decoration: none; color: blue;">⬅ Back to Store</a>
    </div>

                 <script>
        function extractSmartDetails() {
            const text = document.getElementById('product-text').value;
            const resultDiv = document.getElementById('scraper-result');

            if (!text.trim()) {
                alert("Bhai pehle text paste kar!");
                return;
            }

            let name = "Nahi mila";
            let price = "Nahi mila";
            let fabric = "Nahi mila";
            let color = "Nahi mila";
            let size = "Nahi mila";

            // 1. Name Extractor 
            let nameMatch = text.match(/Name\s*:\s*([^\n\r]+)/i);
            if (nameMatch && nameMatch[1]) {
                name = nameMatch[1].trim();
            } else {
                let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                for (let i = 0; i < lines.length; i++) {
                    if (!lines[i].match(/[\u0900-\u097F]/) && !lines[i].includes('₹') && lines[i].length > 5) {
                        name = lines[i];
                        break;
                    }
                }
            }

            // 2. Price Extractor
            let priceMatch = text.match(/(?:₹|rs\.?|price\s*:)\s*([\d,]+)/i);
            if (priceMatch && priceMatch[1]) {
                price = "₹" + priceMatch[1].trim();
            }

            // 3. Color Extractor (Ab strictly usi line tak padhega)
            let colorMatch = text.match(/(?:color|colour)\s*:\s*([^\n\r]+)/i);
            if (colorMatch && colorMatch[1]) {
                color = colorMatch[1].trim();
            }

            // 4. Fabric Extractor (Ab strictly usi line tak padhega)
            let fabricMatch = text.match(/(?:fabric|material)\s*:\s*([^\n\r]+)/i);
            if (fabricMatch && fabricMatch[1]) {
                fabric = fabricMatch[1].trim();
            }

            // 5. Smart Size Extractor
            // "Woman's" wale 's ko hide kar rahe hain taaki wo Size 'S' na bane
            let safeText = text.replace(/'s\b/gi, ''); 
            
            // IND sizes me end boundary hata di, ab agar IND-8Woman likha hoga tab bhi IND-8 nikal lega
            let sizeRegex = /(IND\s*-\s*\d+|UK\s*-\s*\d+|US\s*-\s*\d+|EU\s*-\s*\d+|\bXS\b|\bS\b|\bM\b|\bL\b|\bXL\b|\bXXL\b|\bXXXL\b|\bFree\s*Size\b)/gi;
            let sizesFound = safeText.match(sizeRegex);
            
            if (sizesFound) {
                // Duplicates hata kar format clean karna
                let uniqueSizes = [...new Set(sizesFound.map(s => s.toUpperCase().replace(/\s+/g, '')))];
                size = uniqueSizes.join(', ').replace(/IND-/g, 'IND-'); 
            } else {
                let numSizesMatch = text.match(/(?:Size|Sizes)\s*:\s*([^\n\r]+)/i);
                if (numSizesMatch && numSizesMatch[1]) {
                    size = numSizesMatch[1].trim();
                }
            }

            // Final Assignment to Boxes
            document.getElementById('res-name').value = name;
            document.getElementById('res-price').value = price;
            document.getElementById('res-fabric').value = fabric;
            document.getElementById('res-color').value = color;
            document.getElementById('res-size').value = size;

            resultDiv.style.display = "block";
        }
    </script>



</body>
</html>
