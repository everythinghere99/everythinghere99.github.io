<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Chepu Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        textarea, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { background: #333; color: white; border: none; cursor: pointer; margin-top: 15px; font-weight: bold;}
        button:hover { background: #555; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; border: 1px solid #ccd; display: none; }
        .result-box p { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart Product Extractor 🎯</h2>
        <p style="font-size: 14px; color: #555;">Meesho app/website se product ka poora text copy karo aur yahan paste kar do.</p>
        
        <textarea id="product-text" placeholder="Yahan Meesho ka text paste karo... (Name, Price, Details etc.)"></textarea>
        
        <button onclick="extractSmartDetails()">Extract Details</button>
        
        <div id="scraper-result" class="result-box"></div>
        
        <br><br>
        <a href="index.html" style="text-decoration: none; color: blue;">⬅ Back to Store</a>
    </div>

    <script>
        function extractSmartDetails() {
            const text = document.getElementById('product-text').value;
            const resultDiv = document.getElementById('scraper-result');

            if (!text.trim()) {
                alert("Pehle Meesho ka text paste karo!");
                return;
            }

            let name = "Nahi mila";
            let price = "Nahi mila";
            let fabric = "Nahi mila";
            let color = "Nahi mila";
            let size = "Nahi mila";

            // Text ko lines me todna
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

            // 1. Name: Usually sabse pehli ya dusri line hoti hai
            if (lines.length > 0) {
                name = lines[0]; 
            }

            // 2. Scan every line for exact words
            for (let i = 0; i < lines.length; i++) {
                let currentLine = lines[i];
                let lowerLine = currentLine.toLowerCase();

                // Price dhoondhna (₹ symbol ke sath)
                if (currentLine.includes('₹') && price === "Nahi mila") {
                    let pMatch = currentLine.match(/₹\s*([0-9,]+)/);
                    if (pMatch) price = "₹" + pMatch[1];
                }

                // Fabric / Material
                if (lowerLine.startsWith('fabric') || lowerLine.startsWith('material')) {
                    fabric = currentLine.includes(':') ? currentLine.split(':')[1].trim() : lines[i+1];
                }

                // Color / Colour
                if (lowerLine.startsWith('color') || lowerLine.startsWith('colour')) {
                    color = currentLine.includes(':') ? currentLine.split(':')[1].trim() : lines[i+1];
                }

                // Sizes
                if (lowerLine.startsWith('size') || lowerLine.startsWith('sizes')) {
                    size = currentLine.includes(':') ? currentLine.split(':')[1].trim() : lines[i+1];
                }
            }

            // Screen par result dikhana
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h4>Extracted Details:</h4>
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Price:</strong> ${price}</p>
                <p><strong>Fabric:</strong> ${fabric}</p>
                <p><strong>Color:</strong> ${color}</p>
                <p><strong>Size:</strong> ${size}</p>
                <p style="color: green; font-size: 13px; margin-top: 10px;">✅ 100% Offline & Block-Free!</p>
            `;
        }
    </script>
</body>
</html>
